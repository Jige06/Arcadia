services:

  # Application PHP/Apache
  app:
    build: .
    container_name: arcadia-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: DB_Arcadia
      DB_USER: root
      DB_PASSWORD: rootpassword
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB: arcadia_stats
    depends_on:
      - db
      - mongo

  # Base de données relationnelle (MySQL)
  db:
    image: mysql:8
    container_name: arcadia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: DB_Arcadia
    volumes:
      - arcadia_db_data:/var/lib/mysql
      # Exécute automatiquement les scripts SQL au tout premier démarrage du conteneur
      - ./database:/docker-entrypoint-initdb.d
    ports:
      - "3307:3306"

  # Base de données non relationnelle (MongoDB)
  mongo:
    image: mongo:7
    container_name: arcadia-mongo
    restart: unless-stopped
    volumes:
      - arcadia_mongo_data:/data/db
    ports:
      - "27018:27017"

volumes:
  arcadia_db_data:
  arcadia_mongo_data: